services:
  - type: web
    name: url-summarizer-api
    env: docker
    rootDir: backend
    plan: free
    dockerCommand: sh -c "python -m workers.summarizer & uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-summarizer-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: url-summarizer-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: url-summarizer-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: url-summarizer-db
    plan: free
    databaseName: url_summarizer
    user: render_user
